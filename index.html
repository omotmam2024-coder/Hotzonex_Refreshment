<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1120" />
    <meta name="description" content="Hotzonex Refreshment Centre — stock, daily sales, profit and customer credit tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hotzonex Stock" />
    <title>Hotzonex Refreshment · Stock</title>
    <style>
      html, body { margin: 0; background: #0b1120; }
      /* simple pre-React loader so there's no white flash on slow connections */
      #root:empty::after {
        content: ""; position: fixed; top: 50%; left: 50%;
        width: 34px; height: 34px; margin: -17px 0 0 -17px;
        border: 3px solid #1a2d4a; border-top-color: #00e5c3; border-radius: 50%;
        animation: hzxspin 0.8s linear infinite;
      }
      @keyframes hzxspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
